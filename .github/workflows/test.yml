name: Run Tests

on:
  push:
    branches:
      - dev
      - main
      - release/*
  pull_request:
    branches:
      - dev
      - main

jobs:
  core:
    name: Build & Test Solution
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🧰 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: 🧰 Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 🛠 Build native Talon projects
        run: |
          msbuild Talon.Boot\Talon.Boot.vcxproj /m /p:Configuration=Debug /p:Platform=Win32
          msbuild Talon.Boot\Talon.Boot.vcxproj /m /p:Configuration=Release /p:Platform=Win32
          msbuild Talon.Recon\Talon.Recon.vcxproj /m /p:Configuration=Debug /p:Platform=Win32
          msbuild Talon.Recon\Talon.Recon.vcxproj /m /p:Configuration=Release /p:Platform=Win32

      # Galapa.slnf is Galapa.sln minus the native C++ project (Talon.Boot.vcxproj),
      # which the .NET SDK cannot build. Both native projects were built with MSBuild
      # above; this managed build copies Talon.Boot.dll into the Injector and Toolbox.
      - name: 📦 Install dependencies
        run: dotnet restore Galapa.slnf

      - name: 🛠 Build solution
        run: dotnet build Galapa.slnf --no-restore --configuration Release

      - name: 🧪 Run tests with coverage
        run: dotnet test Galapa.slnf --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: 📦 Create artifact directory
        run: New-Item -ItemType Directory -Force artifacts

      - name: 📦 Package Talon
        run: Compress-Archive -Path Talon.Injector/bin/Release/net10.0-windows/win-x86/* -DestinationPath artifacts/Talon-win-x86.zip

      - name: 🛠 Publish Galapa.Launcher for x64
        run: dotnet publish Galapa.Launcher --configuration Release -r win-x64 --self-contained false -o artifacts/Galapa.Launcher-x64

      - name: 🛠 Publish Galapa.Toolbox for x64
        run: dotnet publish Galapa.Toolbox --configuration Release -r win-x64 --self-contained false -o artifacts/Galapa.Toolbox-x64

      - name: 📦 Zip artifacts
        run: |
          Compress-Archive -Path artifacts/Galapa.Launcher-x64/* -DestinationPath artifacts/Galapa.Launcher-x64.zip
          Compress-Archive -Path artifacts/Galapa.Toolbox-x64/* -DestinationPath artifacts/Galapa.Toolbox-x64.zip

      - name: 📤 Upload Galapa.Launcher x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galapa.Launcher-x64
          path: artifacts/Galapa.Launcher-x64.zip

      - name: 📤 Upload Galapa.Toolbox x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galapa.Toolbox-x64
          path: artifacts/Galapa.Toolbox-x64.zip

      - name: 📤 Upload Talon artifact
        uses: actions/upload-artifact@v4
        with:
          name: Talon-win-x86
          path: artifacts/Talon-win-x86.zip
